<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Hover Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="hover-button">
    <span class="button-label">Hover me!</span>
    <span class="layer layer-white"></span>
    <span class="layer layer-purple-light"></span>
    <span class="layer layer-purple-dark"></span>
    <span class="hover-label">Explore!</span>
  </button>
</body>
</html>
